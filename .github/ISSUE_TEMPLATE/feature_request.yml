name: Feature Request
description: Propose a new feature, protocol, or enhancement for RemoteManager
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make RemoteManager better! Please share your ideas.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? (e.g. "I manage Telnet devices and cannot...")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups here.
